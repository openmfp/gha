name: Auto Labeler

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call: {}

jobs:
  auto-labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Apply labels from PR title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          title="${PR_TITLE}"
          labels=()
          case "${title}" in
            FIX*|Fix*|fix*|FIXED*|Fixed*|fixed*)        labels+=("fix") ;;
          esac
          case "${title}" in
            FEATURE*|Feature*|feature*|FEAT*|Feat*|feat*) labels+=("feature") ;;
          esac
          case "${title}" in
            "BREAKING CHANGE"*|BREAKING*|MAJOR*)         labels+=("BREAKING CHANGE") ;;
          esac
          case "${title}" in
            doc*|docs*|docu*|document*|documentation*)   labels+=("documentation" "fix") ;;
          esac
          case "${title}" in
            build*|rebuild*|ci*)                         labels+=("ci") ;;
          esac
          case "${title}" in
            "build(deps)"*|"build(deps-dev)"*|"fix(deps)"*) labels+=("ci" "dependencies") ;;
          esac
          case "${title}" in
            config*|conf*|configuration*|configure*)     labels+=("config" "fix") ;;
          esac
          case "${title}" in
            chore*)                                      labels+=("chore" "fix") ;;
          esac
          if [ ${#labels[@]} -gt 0 ]; then
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "$(IFS=,; echo "${labels[*]}")"
          fi
