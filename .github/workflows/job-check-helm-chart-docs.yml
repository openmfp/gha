name: Check Helm Chart Docs
on:
  workflow_call:
    inputs:
      chartFolder:
        description: 'The folder where the helm chart is located'
        required: true
        default: ''
        type: string
      headerFile:
        description: 'The header file to use for the helm-docs'
        required: false
        default: '../../docs-templates/header.md.gotmpl'
        type: string
      footerFile:
        description: 'The footer file to use for the helm-docs'
        required: false
        default: '../../docs-templates/footer.md.gotmpl'
        type: string

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install helm-docs
        run: |
          HELM_DOCS_VERSION="1.14.2"
          curl -sSL -o helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          tar xzf helm-docs.tar.gz helm-docs
          sudo mv helm-docs /usr/local/bin/helm-docs
          rm helm-docs.tar.gz
      - name: Run helm-docs
        run: |
          helm-docs \
            --chart-search-root "${{ inputs.chartFolder }}" \
            --template-files "${{ inputs.headerFile }}" \
            --template-files "README.md.gotmpl" \
            --template-files "${{ inputs.footerFile }}"
      - run: git diff --exit-code