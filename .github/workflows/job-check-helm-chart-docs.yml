name: Check Helm Chart Docs

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      chartFolder:
        description: 'The folder where the helm chart is located'
        required: true
        default: ''
        type: string
      headerFile:
        description: 'The header file to use for the helm-docs'
        required: false
        default: '../../docs-templates/header.md.gotmpl'
        type: string
      footerFile:
        description: 'The footer file to use for the helm-docs'
        required: false
        default: '../../docs-templates/footer.md.gotmpl'
        type: string

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache: false
      - name: Install helm-docs
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@37d3055fece566105cf8cff7c17b7b2355a01677 # v1.14.2
      - name: Run helm-docs
        env:
          CHART_FOLDER: ${{ inputs.chartFolder }}
          HEADER_FILE: ${{ inputs.headerFile }}
          FOOTER_FILE: ${{ inputs.footerFile }}
        run: |
          helm-docs \
            --chart-search-root "$CHART_FOLDER" \
            --template-files "$HEADER_FILE" \
            --template-files "README.md.gotmpl" \
            --template-files "$FOOTER_FILE"
      - run: git diff --exit-code