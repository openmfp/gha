name: pipeline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      imageTagName:
        required: true
        type: string
      componentVersionKey:
        required: true
        type: string
      release_branch:
        description: 'Name of the release branch'
        required: false
        type: string
        default: 'main'
      node_version:
        description: 'Node version to use'
        required: false
        type: string
        default: '24'

jobs:
  auto-labeler:
    if: ${{ (github.head_ref || github.ref) != format('refs/heads/{0}',inputs.release_branch) }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/job-auto-labeler.yml

  createVersion:
    if: ${{ (github.head_ref || github.ref) == format('refs/heads/{0}',inputs.release_branch) }}
    permissions:
      contents: write
    uses: ./.github/workflows/job-create-version.yml

  test:
    uses: ./.github/workflows/job-node-test.yml
    with:
      release_branch: ${{ inputs.release_branch }}
      node_version: ${{ inputs.node_version }}
