name: Release
on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      chartFolder:
        required: false
        type: string
        default: 'chart'
      release_branch:
        required: false
        type: string
        default: 'main'
      publishCRDChart:
        required: false
        type: boolean
        default: false
      crdChartPath:
        required: false
        type: string
        default: 'charts/crds'
      updateImageTag:
        required: false
        type: boolean
        default: false
      updateVersion:
        required: false
        type: boolean
        default: true
      pushTags:
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: The chart version that was pushed
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ (github.head_ref || github.ref) == format('refs/heads/{0}',inputs.release_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup yq@latest
        if: ${{ inputs.updateVersion }}
        run: |
          if ! command -v yq &>/dev/null
          then
            mkdir -p /home/runner/.local/bin
            wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /home/runner/.local/bin/yq &&\
              chmod +x /home/runner/.local/bin/yq
          fi
      - name: Update Chart version
        if: ${{ inputs.updateVersion }}
        run: |
          yq e -i '.version = strenv(VERSION)' "$CHART_FOLDER/Chart.yaml"
        env:
          VERSION: ${{ inputs.version }}
          CHART_FOLDER: ${{ inputs.chartFolder }}
      - name: Update Image Tag
        if: ${{ inputs.updateImageTag && inputs.updateVersion }}
        run: |
          yq e -i '.image.tag = strenv(VERSION)' "$CHART_FOLDER/values.yaml"
        env:
          VERSION: ${{ inputs.version }}
          CHART_FOLDER: ${{ inputs.chartFolder }}
      - name: Retrieve helm chart version
        id: chart_version
        run: echo "version=$(yq '.version' "$CHART_FOLDER/Chart.yaml")" >> "$GITHUB_OUTPUT"
        env:
          CHART_FOLDER: ${{ inputs.chartFolder }}
      - name: Log in to ghcr.io
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Push Helm chart
        run: |
          helm package "$CHART_FOLDER"
          helm push $(ls *.tgz | head -1) oci://ghcr.io/${{ github.repository }}
        env:
          CHART_FOLDER: ${{ inputs.chartFolder }}
      - name: Update CRD Chart version
        if: ${{ inputs.publishCRDChart && inputs.updateVersion }}
        run: |
          yq e -i '.version = strenv(VERSION)' "$CHART_FOLDER/$CRD_CHART_PATH/Chart.yaml"
        env:
          VERSION: ${{ inputs.version }}
          CHART_FOLDER: ${{ inputs.chartFolder }}
          CRD_CHART_PATH: ${{ inputs.crdChartPath }}
      - name: Push CRD Helm chart
        if: ${{ inputs.publishCRDChart }}
        run: |
          helm package "$CHART_FOLDER/$CRD_CHART_PATH"
          helm push $(ls *.tgz | tail -1) oci://ghcr.io/${{ github.repository }}
        env:
          CHART_FOLDER: ${{ inputs.chartFolder }}
          CRD_CHART_PATH: ${{ inputs.crdChartPath }}
      - name: Create Release
        if: ${{ inputs.pushTags }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          generateReleaseNotes: true
          tag: ${{ inputs.version }}
          name: ${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.chart_version.outputs.version }}